<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#660000">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barbearia - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/css/styles.css" />
</head>
<body data-page="dashboard">
  <button id="darkModeToggle" class="dark-mode-btn" title="Alternar modo escuro">
    🌙
</button>
  <header>
    <div class="container topo">

  <div class="logo-area">
    <img src="/frontend/Imagens/1.png" class="logo">
    <h1>Cadastro</h1>
  </div>

  <nav>
    <a href="index.html">Relatório</a>
    <a href="dashboard.html">Cadastro</a>
    <a href="#" id="btnSair">Sair</a>
  </nav>

</div>
  </header>

  <main class="container">
    <ul class="nav nav-tabs mt-3 mb-4" id="dashboardTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="clientes-tab" data-bs-toggle="tab" data-bs-target="#clientes-tab-pane" type="button" role="tab" aria-controls="clientes-tab-pane" aria-selected="true">Clientes</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="funcionarios-tab" data-bs-toggle="tab" data-bs-target="#funcionarios-tab-pane" type="button" role="tab" aria-controls="funcionarios-tab-pane" aria-selected="false">Funcionários</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="servicos-tab" data-bs-toggle="tab" data-bs-target="#servicos-tab-pane" type="button" role="tab" aria-controls="servicos-tab-pane" aria-selected="false">Serviços</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="agendamentos-tab" data-bs-toggle="tab" data-bs-target="#agendamentos-tab-pane" type="button" role="tab" aria-controls="agendamentos-tab-pane" aria-selected="false">Agendamentos</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="clientes-tab-pane" role="tabpanel" aria-labelledby="clientes-tab">
        <section class="card secao">
          <h2>Clientes</h2>

          <form id="form-cliente" class="form-grid">
            <input type="hidden" id="cliente-id" />

            <div>
              <label for="cliente-nome">Nome</label>
              <input type="text" id="cliente-nome" required />
            </div>

            <div>
              <label for="cliente-telefone">Telefone</label>
              <input type="text" id="cliente-telefone" required />
            </div>

            <div class="full botoes">
              <button type="submit">Salvar cliente</button>
              <button type="button" id="cancelar-cliente" class="perigo">Cancelar</button>
            </div>
          </form>

          <div class="tabela-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>Telefone</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="lista-clientes">
                <tr>
                  <td colspan="4" class="mensagem-vazia">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="tab-pane fade" id="funcionarios-tab-pane" role="tabpanel" aria-labelledby="funcionarios-tab">
        <section class="card secao">
          <h2>Funcionários</h2>

          <form id="form-funcionario" class="form-grid">
            <input type="hidden" id="funcionario-id" />

            <div>
              <label for="funcionario-nome">Nome</label>
              <input type="text" id="funcionario-nome" required />
            </div>

            <div>
              <label for="funcionario-telefone">Telefone</label>
              <input type="text" id="funcionario-telefone" required />
            </div>

            <div class="full botoes">
              <button type="submit">Salvar funcionário</button>
              <button type="button" id="cancelar-funcionario" class="perigo">Cancelar</button>
            </div>
          </form>

          <div class="tabela-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="lista-funcionarios">
                <tr>
                  <td colspan="3" class="mensagem-vazia">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="tab-pane fade" id="servicos-tab-pane" role="tabpanel" aria-labelledby="servicos-tab">
        <section class="card secao">
          <h2>Serviços</h2>

          <form id="form-servico" class="form-grid">
            <input type="hidden" id="servico-id" />

            <div class="full">
  <label for="servico-tipo">Tipo do serviço</label>
  <input type="text" id="servico-tipo" required />
</div>

<div>
  <label for="servico-preco">Preço</label>
  <input type="number" id="servico-preco" step="0.01" required />
</div>

<div>
  <label for="servico-imagem">Imagem</label>
  <input type="text" id="servico-imagem" placeholder="ex: corte.jpg" required />
</div>

            <div class="full botoes">
              <button type="submit">Salvar serviço</button>
              <button type="button" id="cancelar-servico" class="perigo">Cancelar</button>
            </div>
          </form>

          <div class="tabela-wrap">
            <table>
              <thead>
  <tr>
    <th>ID</th>
    <th>Serviço</th>
    <th>Preço</th>
    <th>Imagem</th>
    <th>Ações</th>
  </tr>
</thead>
              
              <tbody id="lista-servicos">
                <tr>
                  <td colspan="3" class="mensagem-vazia">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="tab-pane fade" id="agendamentos-tab-pane" role="tabpanel" aria-labelledby="agendamentos-tab">
        <section class="card secao">
          <h2>Agendamentos</h2>

          <form id="form-agendamento" class="form-grid">
            <input type="hidden" id="agendamento-id" />

            <div>
              <label for="agendamento-data">Data</label>
              <input type="date" id="agendamento-data" required />
            </div>

            <div>
              <label for="agendamento-horario">Horário</label>
              <input type="time" id="agendamento-horario" required />
            </div>

            <div>
              <label for="agendamento-cliente">Cliente</label>
              <select id="agendamento-cliente" required>
                <option value="">Selecione</option>
              </select>
            </div>

            <div>
              <label for="agendamento-servico">Serviço</label>
              <select id="agendamento-servico" required>
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="full">
              <label for="agendamento-funcionario">Funcionário</label>
              <select id="agendamento-funcionario" required>
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="full botoes">
              <button type="submit">Salvar agendamento</button>
              <button type="button" id="verificar-disponibilidade">Ver disponibilidade</button>
              <button type="button" id="cancelar-agendamento" class="perigo">Cancelar</button>
            </div>
          </form>

          <div>
            <h3>Horários ocupados</h3>
            <ul id="lista-disponibilidade" class="lista-disponibilidade"></ul>
          </div>

          <div class="tabela-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Data</th>
                  <th>Horário</th>
                  <th>Cliente</th>
                  <th>Serviço</th>
                  <th>Funcionário</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="lista-agendamentos">
                <tr>
                  <td colspan="7" class="mensagem-vazia">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

  </main>
  <script>
document.getElementById("btnSair").addEventListener("click", (e) => {
    e.preventDefault();

    localStorage.removeItem("nome");
    localStorage.removeItem("tipo");

    window.location.href = "../login.html";
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/frontend/js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
<div class="menu-mobile">
    <a href="index.html"></a>
    <a href="dashboard.html"></a>
    <a href="cliente.html"></a>
</div>
</body>
</html>
